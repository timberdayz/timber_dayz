name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"

jobs:
  release-tag-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify deploy workflow release tag rules
        run: |
          python scripts/verify_release_tag_generation.py --release-tags v5.3 v5.3.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # [FIX v7.12.9] 依赖单一真相源：
          #   1) requirements.lock.txt = 生产运行时依赖的唯一真相源（完整传递依赖，
          #      全部 == 钉死）。先装它，CI 与生产镜像装的是同一套版本。
          #   2) requirements.txt = 运行时直接依赖清单（同样 == 钉死，与 lock 一致）。
          #   3) requirements-dev.txt = 开发/测试工具，不进生产镜像。
          # ⚠️ pytest/pytest-asyncio 必须**钉版本**（pytest==7.4.3 /
          #    pytest-asyncio==0.21.1，与生产镜像此前验证过的组合一致，
          #    也钉在 requirements-dev.txt 里）。
          # 不钉的话这行会把 pytest 升级成 1.x —— 1.x 移除了 conftest.py 里的
          # session 级 event_loop fixture 覆盖，session 级 async fixture（pg_engine）
          # 会绑到别的 event loop，用到 testcontainers 的用例整片报
          # "another operation is in progress" / "attached to a different loop"。
          if [ -f requirements.lock.txt ]; then pip install -r requirements.lock.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # 注意: pyproject.toml 只包含工具配置（black/ruff/pytest），不是可安装包
          # 项目依赖通过 requirements*.txt 安装，不需要 pip install -e .

      - name: Verify skill-first rule consistency
        run: |
          python scripts/verify_rules_completeness.py

      - name: Verify SQL asset hygiene
        run: |
          python scripts/verify_sql_asset_hygiene.py

      - name: Guard against async/sync session mismatch
        run: |
          # async 上下文不得使用同步 ORM Query API(db.query)。
          # 该错配的典型现场错误是：
          #   'AsyncSession' object has no attribute 'query'
          # 历史上它在「字段映射入库」「隔离区摘要」「统一层统计」等链路上
          # 直接表现为 500，且因为调用方分散、无人排查而长期存在。
          python scripts/verify_sync_query_usage.py --root . --target backend

      - name: Guard against duplicated access-token extraction
        run: |
          # 访问令牌提取必须只有一个真相点(backend/dependencies/auth.py)。
          # 登录优化后 token 在 httpOnly cookie 里,此前散落的 5 份副本
          # 各自来源优先级不同,导致采集实时通道必然被拒。
          python scripts/verify_access_token_extraction.py --root . --target backend

      - name: Guard against async loop cleanup regressions
        run: |
          # 异步任务必须走统一出口(backend/utils/async_task_runner.py),
          # 并且在事件循环存活期间真正关闭连接池。
          # 历史实现用 dispose(close=False) 只软丢弃连接池、不关底层连接,
          # 而连接绑定在已结束的循环上再也关不掉 —— 生产实测 80/80 连接
          # 槽位被打满且只增不减,业务随机 500。
          python scripts/verify_async_loop_cleanup.py --root . --target backend --target modules

      - name: Install Playwright browsers
        run: |
          # [FIX v7.12.9] 钉死版本，与 requirements.lock.txt 保持一致，
          # 避免 CI 的 playwright 与生产镜像漂移。
          pip install "playwright==1.64.1" || echo "Playwright installation failed, continuing..."
          playwright install chromium || echo "Chromium installation failed, continuing..."
        continue-on-error: true

      - name: Detect changed Python files
        id: changed-python
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          CHANGED_PYTHON_FILES="$(python scripts/ci_changed_python_files.py --shell)"
          echo "files=${CHANGED_PYTHON_FILES}" >> $GITHUB_OUTPUT
          if [ -n "${CHANGED_PYTHON_FILES}" ]; then
            echo "[INFO] Changed Python files: ${CHANGED_PYTHON_FILES}"
          else
            echo "[INFO] No changed Python files in scoped CI paths"
          fi

      - name: Detect changed test files
        id: changed-tests
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          CHANGED_TEST_FILES="$(python scripts/ci_changed_python_files.py --shell --tests-only)"
          echo "files=${CHANGED_TEST_FILES}" >> $GITHUB_OUTPUT
          if [ -n "${CHANGED_TEST_FILES}" ]; then
            echo "[INFO] Changed test files: ${CHANGED_TEST_FILES}"
          else
            echo "[INFO] No changed test files in scoped CI paths"
          fi

      - name: Create test environment
        run: |
          mkdir -p data logs temp
          # 使用 env.template 或 .env.template（兼容两种命名）
          if [ -f env.template ]; then
            cp env.template .env
          elif [ -f .env.template ]; then
            cp .env.template .env
          else
            echo "Creating minimal .env for testing"
            touch .env
          fi
          # 设置测试用的环境变量
          echo "TEST_MODE=true" >> .env
          echo "DATABASE_NAME=test_sales_analytics.db" >> .env
          # Fernet key must be 32 url-safe base64-encoded bytes.
          echo "ACCOUNT_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> .env
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> .env
          echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> .env

      - name: Code formatting check
        run: |
          if [ -n "${{ steps.changed-python.outputs.files }}" ]; then
            # Avoid Black's emoji-heavy failure output in CI; apply formatting, then fail with a clear diff.
            black --quiet ${{ steps.changed-python.outputs.files }}
            if ! git diff --exit-code; then
              echo "[ERROR] Code formatting changes detected. Run black locally and commit the result."
              git --no-pager diff
              exit 1
            fi
          else
            echo "No changed Python files for formatting check"
          fi

      - name: Linting
        run: |
          if [ -n "${{ steps.changed-python.outputs.files }}" ]; then
            ruff check ${{ steps.changed-python.outputs.files }}
          else
            echo "No changed Python files for linting"
          fi

      - name: Collection component lint
        run: |
          if [ -n "${{ steps.changed-python.outputs.files }}" ]; then
            python scripts/lint_collection_components.py --paths "${{ steps.changed-python.outputs.files }}" --fail-on none
          else
            echo "No changed Python files for collection component lint"
          fi

      - name: Type checking (critical modules only)
        if: matrix.python-version == '3.11'
        run: |
          mypy modules/core/ --ignore-missing-imports || true

      - name: Validate configurations
        run: |
          python scripts/validate_configs.py --ci || echo "Configuration validation completed"
        continue-on-error: true

      - name: Database Design Rules Validation
        run: |
          echo "Validating database design rules..."
          python scripts/validate_code_compliance.py || echo "Validation completed with warnings"
          echo "Database design rules validation completed"
        continue-on-error: true

      - name: Run contract tests
        run: |
          # 检查并运行存在的契约测试
          for script in modules/apps/account_manager/contract_tests.py \
                       modules/apps/collection_center/contract_tests.py \
                       modules/apps/web_interface_manager/contract_tests.py; do
            if [ -f "$script" ]; then
              python "$script" || echo "$(basename $script) completed"
            else
              echo "$(basename $script) not found, skipping"
            fi
          done
        continue-on-error: true

      - name: Run unified health check
        run: |
          if [ -f tests/test_unified_health_check.py ]; then
            python tests/test_unified_health_check.py || echo "Unified health check completed"
          else
            echo "test_unified_health_check.py not found, skipping"
          fi
        continue-on-error: true

      - name: Run pytest (if test files exist)
        run: |
          TEST_PATHS="${{ steps.changed-tests.outputs.files }}"
          if [ -n "${TEST_PATHS}" ]; then
            pytest ${TEST_PATHS} -v --cov=backend --cov=modules --cov-report=xml
          else
            echo "No changed test files found, skipping pytest"
          fi

      - name: Run performance regression entry
        if: matrix.python-version == '3.11'
        run: |
          python scripts/verify_performance_regression.py --mode ci

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend-guard:
    # 前端守卫测试此前**根本不在 CI 里跑**，所以 4 个因路径错误崩溃、
    # 断言从未执行的「哑测试」能长期伪装成普通失败（见方案文档 §3.3）。
    # 这个 job 只做一件事：把「压根没跑起来」的测试单独挑出来报警。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Guard against silent frontend tests
        run: python3 scripts/ci_frontend_test_silence_gate.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.9.4 safety==3.7.0

      - name: Resolve base SHA (PR only)
        id: base-sha
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed Python files
        id: changed-python
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          CHANGED_PYTHON_FILES="$(python scripts/ci_changed_python_files.py --shell --exclude-tests)"
          echo "files=${CHANGED_PYTHON_FILES}" >> $GITHUB_OUTPUT
          if [ -n "${CHANGED_PYTHON_FILES}" ]; then
            echo "[INFO] Changed Python files: ${CHANGED_PYTHON_FILES}"
          else
            echo "[INFO] No changed Python files in scoped CI paths"
          fi

      - name: Run Bandit security scan
        run: |
          if [ -n "${{ steps.changed-python.outputs.files }}" ]; then
            # Use --exit-zero so the step continues and prints findings; enforce the gate explicitly.
            bandit -s B608 ${{ steps.changed-python.outputs.files }} -f json -o bandit-report.json --exit-zero
            python scripts/ci_bandit_gate.py bandit-report.json --fail-on-severity HIGH
          else
            echo "No changed Python files for Bandit scan"
          fi

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Check for known vulnerabilities
        continue-on-error: true
        run: |
          FILE_ARGS=""
          for f in requirements.lock.txt requirements.txt requirements-dev.txt; do
            if [ -f "$f" ]; then
              FILE_ARGS="$FILE_ARGS -r $f"
            fi
          done
          if [ -n "${FILE_ARGS}" ]; then
            # `safety check` is deprecated upstream, but still used here for compatibility.
            safety check --json --policy-file .safety-policy.yml --save-json safety-report-head.json ${FILE_ARGS}
          else
            echo "No requirements files found, skipping safety"
          fi

      - name: Safety diff gate (PR only, fail on new vulns)
        if: steps.base-sha.outputs.sha != ''
        run: |
          POLICY_PATH="${RUNNER_TEMP}/safety-policy.yml"
          # Base SHA may not include the policy file; keep a copy outside the repo tree.
          cp .safety-policy.yml "${POLICY_PATH}"

          FILE_ARGS=""
          for f in requirements.lock.txt requirements.txt requirements-dev.txt; do
            if [ -f "$f" ]; then
              FILE_ARGS="$FILE_ARGS -r $f"
            fi
          done
          if [ -z "${FILE_ARGS}" ]; then
            echo "No requirements files found, skipping safety gate"
            exit 0
          fi

          # Generate base report in the same workspace by temporarily checking out the base SHA.
          git checkout --quiet ${{ steps.base-sha.outputs.sha }}
          safety check --json --policy-file "${POLICY_PATH}" --save-json safety-report-base.json ${FILE_ARGS} || true

          # Restore head for subsequent steps/artifacts.
          git checkout --quiet ${{ github.sha }}

          python scripts/ci_safety_gate.py safety-report-head.json --base-report safety-report-base.json --fail-on-new

      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: |
            safety-report-head.json
            safety-report-base.json
          if-no-files-found: ignore

      - name: Check for secrets in code
        run: |
          echo "Scanning changed Python files for potential hardcoded secrets..."
          if [ -n "${{ steps.changed-python.outputs.files }}" ]; then
            MATCHES=$(grep -nE "(password|secret_key|api_key|token)\s*=\s*['\"][^'\"]+['\"]" ${{ steps.changed-python.outputs.files }} | grep -v "# noqa" | grep -v "example" | grep -v "os.getenv" | grep -v "os.environ" | grep -v "settings\." | grep -v "config\." || true)
            if [ -n "${MATCHES}" ]; then
              echo "${MATCHES}"
              echo "Found potential hardcoded secrets"
              exit 1
            fi
          else
            echo "No changed Python files for secret scan"
          fi
          echo "Secret scan completed"

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Check project structure
        run: |
          # 验证关键目录和文件存在
          echo "Checking project structure..."
          test -d modules/core || (echo "Missing modules/core directory" && exit 1)
          test -d modules/apps || (echo "Missing modules/apps directory" && exit 1)
          # env.template 是标准文件名
          test -f env.template || test -f .env.template || echo "Note: env template file not found (optional)"
          echo "Project structure check passed"

      - name: Check for large files
        run: |
          # 检查是否有大文件被意外提交
          find . -type f -size +10M -not -path "./.git/*" | while read file; do
            echo "Warning: Large file found: $file"
          done || true
          echo "Large file check completed"

      - name: Validate configuration files
        run: |
          # 验证YAML配置文件语法
          pip install "pyyaml==6.0.3" || true
          python -c "
          import yaml
          import os
          from pathlib import Path

          config_dir = Path('config')
          if config_dir.exists():
              for yaml_file in config_dir.rglob('*.yaml'):
                  try:
                      with open(yaml_file, 'r', encoding='utf-8') as f:
                          yaml.safe_load(f)
                      print(f'{yaml_file} syntax OK')
                  except Exception as e:
                      print(f'{yaml_file} syntax error: {e}')
                      # Don't exit, just report
          else:
              print('No config directory found, skipping YAML validation')
          " || echo "YAML validation completed"
        continue-on-error: true

  # Phase 3.1: Docker 镜像构建（可选集成）
  # 注意：镜像构建已在独立的 docker-build.yml 工作流中实现
  # 如需在 CI 中自动触发，可取消下面的注释
  # build-images:
  #   needs: [test, security-scan, build-check]
  #   if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
  #   uses: ./.github/workflows/docker-build.yml

  notify:
    runs-on: ubuntu-latest
    needs: [release-tag-rules, test, security-scan, build-check, frontend-guard]
    if: always()
    steps:
      - name: Notify results
        run: |
          if [ "${{ needs.release-tag-rules.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.security-scan.result }}" == "success" ] && [ "${{ needs.build-check.result }}" == "success" ] && [ "${{ needs.frontend-guard.result }}" == "success" ]; then
            echo "[OK] All CI checks passed!"
          else
            echo "[FAIL] Some CI checks failed"
            echo "Release tag rules: ${{ needs.release-tag-rules.result }}"
            echo "Test: ${{ needs.test.result }}"
            echo "Security: ${{ needs.security-scan.result }}"
            echo "Build: ${{ needs.build-check.result }}"
            echo "Frontend guard: ${{ needs.frontend-guard.result }}"
          fi
