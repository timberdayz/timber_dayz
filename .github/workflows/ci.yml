name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"

jobs:
  release-tag-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify deploy workflow release tag rules
        run: |
          python scripts/verify_release_tag_generation.py --release-tags v5.3 v5.3.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # [FIX v7.12.9] 依赖单一真相源：
          #   1) requirements.lock.txt = 生产运行时依赖的唯一真相源（完整传递依赖，
          #      全部 == 钉死）。先装它，CI 与生产镜像装的是同一套版本。
          #   2) requirements.txt = 运行时直接依赖清单（同样 == 钉死，与 lock 一致）。
          #   3) requirements-dev.txt = 开发/测试工具，不进生产镜像。
          # ⚠️ pytest/pytest-asyncio 必须**钉版本**（pytest==7.4.3 /
          #    pytest-asyncio==0.21.1，与生产镜像此前验证过的组合一致，
          #    也钉在 requirements-dev.txt 里）。
          # 不钉的话这行会把 pytest 升级成 1.x —— 1.x 移除了 conftest.py 里的
          # session 级 event_loop fixture 覆盖，session 级 async fixture（pg_engine）
          # 会绑到别的 event loop，用到 testcontainers 的用例整片报
          # "another operation is in progress" / "attached to a different loop"。
          if [ -f requirements.lock.txt ]; then pip install -r requirements.lock.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # 注意: pyproject.toml 只包含工具配置（black/ruff/pytest），不是可安装包
          # 项目依赖通过 requirements*.txt 安装，不需要 pip install -e .

      - name: Verify skill-first rule consistency
        run: |
          python scripts/verify_rules_completeness.py

      - name: Verify SQL asset hygiene
        run: |
          python scripts/verify_sql_asset_hygiene.py

      - name: Guard against async/sync session mismatch
        run: |
          # async 上下文不得使用同步 ORM Query API(db.query)。
          # 该错配的典型现场错误是：
          #   'AsyncSession' object has no attribute 'query'
          # 历史上它在「字段映射入库」「隔离区摘要」「统一层统计」等链路上
          # 直接表现为 500，且因为调用方分散、无人排查而长期存在。
          python scripts/verify_sync_query_usage.py --root . --target backend

      - name: Guard against duplicated access-token extraction
        run: |
          # 访问令牌提取必须只有一个真相点(backend/dependencies/auth.py)。
          # 登录优化后 token 在 httpOnly cookie 里,此前散落的 5 份副本
          # 各自来源优先级不同,导致采集实时通道必然被拒。
          python scripts/verify_access_token_extraction.py --root . --target backend

      - name: Guard against async loop cleanup regressions
        run: |
          # 异步任务必须走统一出口(backend/utils/async_task_runner.py),
          # 并且在事件循环存活期间真正关闭连接池。
          # 历史实现用 dispose(close=False) 只软丢弃连接池、不关底层连接,
          # 而连接绑定在已结束的循环上再也关不掉 —— 生产实测 80/80 连接
          # 槽位被打满且只增不减,业务随机 500。
          python scripts/verify_async_loop_cleanup.py --root . --target backend --target modules

      - name: Install Playwright browsers
        run: |
          # [FIX v7.12.9] 钉死版本，与 requirements.lock.txt 保持一致，
          # 避免 CI 的 playwright 与生产镜像漂移。
          pip install "playwright==1.64.1" || echo "Playwright installation failed, continuing..."
          playwright install chromium || echo "Chromium installation failed, continuing..."
        continue-on-error: true

      - name: Detect changed Python files
        id: changed-python
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          CHANGED_PYTHON_FILES="$(python scripts/ci_changed_python_files.py --shell)"
          echo "files=${CHANGED_PYTHON_FILES}" >> $GITHUB_OUTPUT
          if [ -n "${CHANGED_PYTHON_FILES}" ]; then
            echo "[INFO] Changed Python files: ${CHANGED_PYTHON_FILES}"
          else
            echo "[INFO] No changed Python files in scoped CI paths"
          fi

      - name: Detect changed test files
        id: changed-tests
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          CHANGED_TEST_FILES="$(python scripts/ci_changed_python_files.py --shell --tests-only)"
          echo "files=${CHANGED_TEST_FILES}" >> $GITHUB_OUTPUT
          if [ -n "${CHANGED_TEST_FILES}" ]; then
            echo "[INFO] Changed test files: ${CHANGED_TEST_FILES}"
          else
            echo "[INFO] No changed test files in scoped CI paths"
          fi

      - name: Create test environment
        run: |
          mkdir -p data logs temp
          # 使用 env.template 或 .env.template（兼容两种命名）
          if [ -f env.template ]; then
            cp env.template .env
          elif [ -f .env.template ]; then
            cp .env.template .env
          else
            echo "Creating minimal .env for testing"
            touch .env
          fi
          # 设置测试用的环境变量
          echo "TEST_MODE=true" >> .env
          echo "DATABASE_NAME=test_sales_analytics.db" >> .env
          # Fernet key must be 32 url-safe base64-encoded bytes.
          echo "ACCOUNT_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> .env
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> .env
          echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> .env

      - name: Code formatting check
        run: |
          if [ -n "${{ steps.changed-python.outputs.files }}" ]; then
            # Avoid Black's emoji-heavy failure output in CI; apply formatting, then fail with a clear diff.
            black --quiet ${{ steps.changed-python.outputs.files }}
            if ! git diff --exit-code; then
              echo "[ERROR] Code formatting changes detected. Run black locally and commit the result."
              git --no-pager diff
              exit 1
            fi
          else
            echo "No changed Python files for formatting check"
          fi

      - name: Linting
        run: |
          if [ -n "${{ steps.changed-python.outputs.files }}" ]; then
            ruff check ${{ steps.changed-python.outputs.files }}
          else
            echo "No changed Python files for linting"
          fi

      - name: Collection component lint
        # 批次 F-1（减重批）：本步骤的扫描范围已收窄到 modules/platforms/**
        # （采集组件规则的本意范围，路径真源在 scripts/lint_collection_components.py）。
        # 收窄之前，CI 把「本次改动的全部 Python 文件」喂进来 ⇒ backend/ tests/ 里的
        # 普通业务代码也被套上采集组件规则，全仓报出 454 行告警，而那些告警
        # 既不属于规则本意范围、也从不改变流水线结果。
        # 门禁强度**不变**：仍是 `--fail-on none` 告警模式；升成硬门禁属加固方向，
        # 另记待办由业务负责人拍板。
        #
        # 批次 F-1 一并移除了 6 个「只告警、从不改变结果」的噪音步骤。每一项的
        # 实测理由、替代覆盖、以及「哪一步替它兜底」，全部写在书面记录里：
        # docs/superpowers/plans/STATUS.md 的「批次 F」节。
        # 守护：backend/tests/test_ci_weight_reduction_contract.py
        run: |
          if [ -n "${{ steps.changed-python.outputs.files }}" ]; then
            python scripts/lint_collection_components.py --paths "${{ steps.changed-python.outputs.files }}" --scope platforms --fail-on none
          else
            echo "No changed Python files for collection component lint"
          fi

      - name: Validate configurations
        run: |
          python scripts/validate_configs.py --ci || echo "Configuration validation completed"
        continue-on-error: true

      - name: Run pytest (if test files exist)
        run: |
          TEST_PATHS="${{ steps.changed-tests.outputs.files }}"
          if [ -n "${TEST_PATHS}" ]; then
            pytest ${TEST_PATHS} -v --cov=backend --cov=modules --cov-report=xml
          else
            echo "No changed test files found, skipping pytest"
          fi

      - name: Run unit guard tests (tests/unit)
        run: |
          # ⚠️ tests/unit **不在** backend/tests 的全量回归范围内。
          # 以前 CI 只跑「本次改动到的测试文件」⇒ 这一目录里的用例会长期不跑，
          # 口径漂移（例如规格 D1 改了度量字段能不能进 hash）导致的红用例
          # 能潜伏好几天才被人发现（2026-11-10 实测就是如此）。
          #
          # 这里**每次 CI 都跑**（约 2 秒，不碰数据库），把这一类红挡住。
          #
          # 用 python -m 而不是裸 pytest：仓库根必须在 sys.path 上，
          # 否则这些用例 import backend.* 会直接 collection error。
          python -m pytest tests/unit -q --no-header

      - name: Run root contract tests (no DB)
        run: |
          # 根 tests/ 目录里**不依赖数据库**的那批契约/巡检用例。
          #
          # 为什么单独列清单而不是直接跑整个 tests/：
          #   tests/test_collection_config_core_schema_migration_contract.py 与
          #   tests/test_follow_investment_finance_schema_contract.py 这两个文件
          #   通过 tests/db_test_config.py 连 127.0.0.1:15432 上的本地 PostgreSQL
          #   （CI runner 没有这套环境）整目录跑会变成环境性红。
          # 那两个文件已改由 migration-pg-contract job 托管（那边配了 PG 服务容器），这里不重复跑。
          #
          # 注意不要把 tests/test_current_schema_migration_postgres_contract.py
          # 也当成依赖 15432 的文件：它每个用例自起临时 postgres:15 容器
          # （随机空闲端口）并把连接串传给迁移子进程 => 只需要 Docker。
          # 它已单独进 migration-pg-contract job。
          #
          # 这里的清单是 2026-11-10 逐条定性后挑出来的**纯源码/契约**用例，
          # 覆盖：组件加载器、执行器容错机制、ORM SSOT 分段、发版可观测性、
          #       镜像同步脚本、云同步载荷契约、采集恢复接口。
          #
          # 2026-11-13 补进 3 个 SSH/隧道契约文件（同样是纯源码，不建连接、不碰数据库）：
          #   test_cloud_sync_tunnel_watchdog.py          —— 看门狗与采集启动脚本的 ssh 参数不许漂移
          #   test_container_cloud_tunnel_host_contract.py —— 容器侧隧道宿主必须是字面量
          #   test_ssh_access_contract.py                 —— SSH 账号/钥匙/端口的**文档 ↔ 脚本**一致性
          # 为什么要补：这三份守护**之前根本不在 CI 里跑** ⇒ 隧道契约只在本机绿、
          # 线上漂了没人知道；其中 test_ssh_access_contract.py 守的是
          # docs/guides/SSH_ACCESS.md 这份真源与脚本不脱节。
          #
          # 2026-11-13 再补 1 个密钥门禁契约文件（同样是纯源码，不碰数据库）：
          #   test_secret_files_not_tracked.py —— 密钥文件不许再被 git 跟踪，
          #   且 scripts/check_precommit_secrets.py 的 is_blocked() 真的拦得住。
          # 为什么要补：公开仓库曾长期跟踪着 .env.production.passwords.txt /
          # .env.cleaned / accounts.enc（密文 + 解密密钥同时公开），
          # 而仓库自带的密钥门禁当时对这三个文件**全部放行**。
          #
          # 2026-11-13 第四轮扩：再补 1 个 .ps1 编码契约文件（纯源码，不碰数据库）：
          #   test_ps_env_file_encoding_contract.py —— 两个 env 读取脚本必须显式 UTF8，
          #   且 .ps1 必须**无 BOM**、看门狗脚本必须**纯 ASCII**。
          # 为什么要补：这个文件此前**根本不在 CI 里跑** ⇒ 2026-11-13 实测发现，
          #   v7.25.0 给看门狗脚本加了一个 ⚠️（非 ASCII），v7.26.0 又给它补了 BOM，
          #   两批都打破了 2026-11-11 写进纸面的「.ps1 全部无 BOM + 看门狗纯 ASCII」
          #   约定，而 CI 三线全绿 —— 典型的「流水线绿 ≠ 验收」。
          #   ⇒ 约定必须有守护，守护必须进 CI，否则等于没写。
          #
          # 2026-11-13 第五轮扩：再补 2 个 testcontainers 清理契约文件（纯源码，不碰数据库）：
          #   test_cleanup_test_containers_contract.py     —— 清理脚本的安全边界
          #     （只碰 testcontainers 容器 + 匿名卷；命名卷永不触碰；绝不用 prune）
          #   test_cleanup_test_containers_wired_contract.py —— **清理脚本必须被调用**
          #     为什么要补：2026-11-13 实测，本机 4 天里攒了 11 个匿名卷（736 MB），
          #     根因不是 testcontainers 泄漏（实测 Ryuk 正常回收），而是
          #     「进程被强杀 + 事后没人跑清理脚本」—— 脚本早就存在，却只有它自己的
          #     契约测试引用它。⇒ **没人调用的守护不是守护**：守护本身也要进 CI。
          #
          # 2026-11-13 第六轮扩：补 1 个 testcontainers 收敛契约文件（纯源码，不碰数据库）：
          #   test_testcontainers_consolidation_contract.py —— **集成测试不许自己起容器**
          #     为什么要补：2026-11-13 实测，backend/tests/data_pipeline/ 里有 40 处
          #     `with PostgresContainer("postgres:15") as pg:` 样板（11 个文件），
          #     每个容器启动 1.76 秒 ⇒ 一轮回归付 ~70 秒纯启动开销、还各留一个匿名卷。
          #     已收敛为「一个会话级容器 + 每用例一个独立 database」（CREATE DATABASE
          #     实测 0.063 秒）。⇒ 容器唯一真源在 conftest；守护把它锁住。
          #
          # 2026-11-13 第七轮扩：补 1 个账号浏览器环境契约文件（纯源码，不碰数据库）：
          #   test_account_browser_identity_contract.py —— 账号**只隔离状态、不造指纹差异**的契约
          #     （浏览器环境参数与账号无关；UA 不含 HeadlessChrome；locale/时区跟随出口 IP；
          #       不注入屏幕尺寸；旧的「按账号派生画像 + machine_id 隔离」整套已移除；
          #       巡店/顺序采集/并行采集三条路径同源）
          # 为什么要补：这个守护此前**根本不在 CI 里跑** ⇒ 「账号间不可关联」这条
          #   业务底线只写在代码里，任何一次改动都能悄悄把它改坏而流水线照样全绿。
          #   典型的「流水线绿 ≠ 验收」。
          #
          #   ⚠️ 2026-11-14 方向修订后重写：实测表明**同机多账号的硬件指纹完全相同**
          #   （独立 profile 的 canvas/WebGL/字体/核数 14 项全同），且平台**读不到**
          #   machine_id ⇒ 「按账号派生指纹」既无关联收益、又会造出「分布外」的异常特征。
          #   真正能分开账号的是**状态层**（独立 profile 目录）+ **出口 IP**。
          #
          # 2026-11-13 第八轮扩：补 1 个账号就绪状态契约文件（纯源码，不碰数据库）：
          #   test_account_readiness_contract.py —— 巡店就绪状态的**判据唯一**与**可见性**
          #     （登录态判据在采集侧 / CLI 体检 / 巡店面板三处同源；
          #       就绪快照只剩「已首登 + 已配出口」两项；
          #       浏览器进程退出后面板状态必须回写（关窗口就不能再显示 OPEN）；
          #       被白名单排除的账号必须显式列出并带原因；
          #       前端必须轮询并渲染就绪徽标）
          # 为什么要补：巡店面板此前对「为什么这个账号不出现」「这个账号登录过没有」
          #   **零提示** —— 运维只能靠猜。加了提示就得保证提示不会骗人：
          #   三处判定必须是同一份实现，否则会出现「面板说已首登、采集说没登录」。
          #
          # 2026-11-13 第九轮扩：补 1 个代理**来源位**契约文件（纯源码、纯同步、不碰数据库）：
          #   test_account_proxy_source_contract.py —— 代理权威位在**主账号级**、店铺级仅回退
          #     （出口绑在登录身份上 ⇒ 一个登录身份只有一个出口 ⇒ 平台无法把账号
          #       关联成「同一个出口的账号矩阵」；巡店与采集必须用同一个来源）
          # 为什么要补：代理权威位刚上移到主账号级（v7.27.0），**此前没有任何用例
          #   覆盖这个优先级** ⇒ 有人把它改回店铺级，流水线照样全绿。
          #
          #   ⚠️ 为什么**不**把 backend/tests/test_account_proxy_config.py 放进本清单：
          #   那个文件有 9 个 **async** 用例，而 backend/tests/conftest.py 用
          #   `@pytest.fixture(scope="session")` 覆盖了 event_loop —— 在 CI 钉的
          #   pytest==7.4.3 / pytest-asyncio==0.21.1 下这个覆盖**会生效**
          #   （1.x 忽略它）⇒ 混跑时它会拿到**已关闭**的 session 事件循环，
          #   9 个用例报 `RuntimeError: Event loop is closed`
          #   （2026-11-14 实测，CI run 43485663421）。
          #   ⇒ 契约断言放进**纯同步**的新文件，异步用例留在原文件由全量回归覆盖。
          #
          # 2026-11-10 第三轮扩：又补进 30 个文件。怎么确认它们不碰数据库的 ——
          # 把 TEST_DB_PORT 指向不可达端口 1、同时把 DATABASE_URL 指向不可达地址
          # （db_test_config 走前者、迁移器走后者）⇒ 任何真连库的行为都会立刻失败。
          # 这样的「无 PG 可达」环境下本地跑 = 225 passed / 37.2s、零 skip、零失败
          # ⇒ 它们在 CI runner 上不会变成环境性红。
          python -m pytest -q --no-header \
            tests/test_component_loader.py \
            tests/test_robustness.py \
            tests/test_db_schema_contract.py \
            tests/test_release_observability_contract.py \
            tests/test_git_mirror_sync_script.py \
            tests/test_cloud_b_class_sync_e2e_contract.py \
            tests/test_collection_resume_api.py \
            tests/e2e/test_shopee_collection.py \
            tests/test_current_schema_migration_contract.py \
            tests/test_rebuild_local_current_schema.py \
            backend/tests/test_bootstrap_seed_manifest.py \
            backend/tests/test_remote_deploy_migration_contract.py \
            backend/tests/test_celery_dispatch_event_loop_isolation.py \
            backend/tests/test_celery_dispatch_resilience.py \
            backend/tests/test_deploy_artifact_retention_contract.py \
            tests/test_4c8g_follow_up_acceptance.py \
            tests/test_alembic_version_table_contract.py \
            tests/test_cache_service.py \
            tests/test_capability_filter.py \
            tests/test_catalog_scanner.py \
            tests/test_cloud_b_class_mirror_manager.py \
            tests/test_cloud_b_class_sync_cli.py \
            tests/test_cloud_b_class_sync_run_logging.py \
            tests/test_cloud_b_class_sync_schema.py \
            tests/test_cloud_sync_tunnel_watchdog.py \
            tests/test_container_cloud_tunnel_host_contract.py \
            tests/test_ssh_access_contract.py \
            tests/test_secret_files_not_tracked.py \
            tests/test_data_query_service.py \
            tests/test_deploy_production_workflow_tags.py \
            tests/test_ensure_local_dev_admin.py \
            tests/test_fallback.py \
            tests/test_field_mapping_contract.py \
            tests/test_formal_collection_powershell.py \
            tests/test_local_migration_backup.py \
            tests/test_login_success_criteria_injection.py \
            tests/test_migrate_service_env_contract.py \
            tests/test_prod_release_fail_closed_contracts.py \
            tests/test_ps_env_file_encoding_contract.py \
            backend/tests/test_cleanup_test_containers_wired_contract.py \
            backend/tests/test_cleanup_test_containers_contract.py \
            backend/tests/test_testcontainers_consolidation_contract.py \
            backend/tests/test_ci_weight_reduction_contract.py \
            backend/tests/test_status_index_slim_contract.py \
            backend/tests/test_guard_test_classification_contract.py \
            backend/tests/test_timestamp_defaults_migrations_contract.py \
            tests/test_rebuild_views_materialized_self_heal.py \
            tests/test_reliability_services.py \
            tests/test_run_local_port_selection.py \
            tests/test_smart_wait.py \
            tests/test_smart_wait_simple.py \
            tests/test_target_management_api.py \
            tests/test_unified_health_check.py \
            tests/test_verify_cloud_sync_local.py \
            tests/test_verify_release_local.py \
            tests/test_verify_release_tag_generation.py \
            tests/test_verify_remote_deploy_contracts.py \
            tests/test_account_browser_identity_contract.py \
            tests/test_account_readiness_contract.py \
            tests/test_account_proxy_source_contract.py

      - name: Run performance regression entry
        if: matrix.python-version == '3.11'
        run: |
          python scripts/verify_performance_regression.py --mode ci

      - name: Clean up leftover test containers
        # 收尾: 清理测试期遗留的 testcontainers 容器与匿名卷。
        #
        # 为什么必须有这一步(2026-11-13 实测):
        #   本机 4 天里攒了 11 个匿名 postgres 卷(736 MB), 其中 6 个在 72 秒内连发
        #   —— 那是进程被强杀、atexit 没跑、事后又没人清理造成的。
        #   scripts/cleanup_test_containers.py 早就存在, 却只有它自己的契约测试
        #   引用它 ⇒ "脚本在仓库里"不等于"会被执行"。
        #
        # 本步是 **best-effort**: 清理失败不得让流水线变红(那会掩盖真实失败),
        # 所以用 `|| true` 兜住; 幂等 —— 没有残留时退出码 0。
        run: |
          python scripts/cleanup_test_containers.py --apply || true

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend-guard:
    # 前端守卫测试此前**根本不在 CI 里跑**，所以 4 个因路径错误崩溃、
    # 断言从未执行的「哑测试」能长期伪装成普通失败（见方案文档 §3.3）。
    # 这个 job 只做一件事：把「压根没跑起来」的测试单独挑出来报警。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Guard against silent frontend tests
        run: python3 scripts/ci_frontend_test_silence_gate.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.9.4 safety==3.7.0

      - name: Resolve base SHA (PR only)
        id: base-sha
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed Python files
        id: changed-python
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          CHANGED_PYTHON_FILES="$(python scripts/ci_changed_python_files.py --shell --exclude-tests)"
          echo "files=${CHANGED_PYTHON_FILES}" >> $GITHUB_OUTPUT
          if [ -n "${CHANGED_PYTHON_FILES}" ]; then
            echo "[INFO] Changed Python files: ${CHANGED_PYTHON_FILES}"
          else
            echo "[INFO] No changed Python files in scoped CI paths"
          fi

      - name: Run Bandit security scan
        run: |
          if [ -n "${{ steps.changed-python.outputs.files }}" ]; then
            # Use --exit-zero so the step continues and prints findings; enforce the gate explicitly.
            bandit -s B608 ${{ steps.changed-python.outputs.files }} -f json -o bandit-report.json --exit-zero
            python scripts/ci_bandit_gate.py bandit-report.json --fail-on-severity HIGH
          else
            echo "No changed Python files for Bandit scan"
          fi

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Safety diff gate (PR only, fail on new vulns)
        if: steps.base-sha.outputs.sha != ''
        run: |
          POLICY_PATH="${RUNNER_TEMP}/safety-policy.yml"
          # Base SHA may not include the policy file; keep a copy outside the repo tree.
          cp .safety-policy.yml "${POLICY_PATH}"

          FILE_ARGS=""
          for f in requirements.lock.txt requirements.txt requirements-dev.txt; do
            if [ -f "$f" ]; then
              FILE_ARGS="$FILE_ARGS -r $f"
            fi
          done
          if [ -z "${FILE_ARGS}" ]; then
            echo "No requirements files found, skipping safety gate"
            exit 0
          fi

          # Generate base report in the same workspace by temporarily checking out the base SHA.
          git checkout --quiet ${{ steps.base-sha.outputs.sha }}
          safety check --json --policy-file "${POLICY_PATH}" --save-json safety-report-base.json ${FILE_ARGS} || true

          # Restore head for subsequent steps/artifacts.
          git checkout --quiet ${{ github.sha }}

          python scripts/ci_safety_gate.py safety-report-head.json --base-report safety-report-base.json --fail-on-new

      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: |
            safety-report-head.json
            safety-report-base.json
          if-no-files-found: ignore

      - name: Check for secrets in code
        run: |
          echo "Scanning changed Python files for potential hardcoded secrets..."
          if [ -n "${{ steps.changed-python.outputs.files }}" ]; then
            MATCHES=$(grep -nE "(password|secret_key|api_key|token)\s*=\s*['\"][^'\"]+['\"]" ${{ steps.changed-python.outputs.files }} | grep -v "# noqa" | grep -v "example" | grep -v "os.getenv" | grep -v "os.environ" | grep -v "settings\." | grep -v "config\." || true)
            if [ -n "${MATCHES}" ]; then
              echo "${MATCHES}"
              echo "Found potential hardcoded secrets"
              exit 1
            fi
          else
            echo "No changed Python files for secret scan"
          fi
          echo "Secret scan completed"

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Check project structure
        run: |
          # 验证关键目录和文件存在
          echo "Checking project structure..."
          test -d modules/core || (echo "Missing modules/core directory" && exit 1)
          test -d modules/apps || (echo "Missing modules/apps directory" && exit 1)
          # env.template 是标准文件名
          test -f env.template || test -f .env.template || echo "Note: env template file not found (optional)"
          echo "Project structure check passed"

      - name: Validate configuration files
        run: |
          # 验证YAML配置文件语法
          pip install "pyyaml==6.0.3" || true
          python -c "
          import yaml
          import os
          from pathlib import Path

          config_dir = Path('config')
          if config_dir.exists():
              for yaml_file in config_dir.rglob('*.yaml'):
                  try:
                      with open(yaml_file, 'r', encoding='utf-8') as f:
                          yaml.safe_load(f)
                      print(f'{yaml_file} syntax OK')
                  except Exception as e:
                      print(f'{yaml_file} syntax error: {e}')
                      # Don't exit, just report
          else:
              print('No config directory found, skipping YAML validation')
          " || echo "YAML validation completed"
        continue-on-error: true

  # Phase 3.1: Docker 镜像构建（可选集成）
  # 注意：镜像构建已在独立的 docker-build.yml 工作流中实现
  # 如需在 CI 中自动触发，可取消下面的注释
  # build-images:
  #   needs: [test, security-scan, build-check]
  #   if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
  #   uses: ./.github/workflows/docker-build.yml

  fresh-db-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock.txt ]; then pip install -r requirements.lock.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run fresh-database bootstrap drill (Docker)
        run: |
          # 「空库从零建库」全链演练（甲）：临时 Postgres 容器 → 两段式引导 → 到 head
          # → 数据同步关键列校验 → ORM Schema 一致性校验。
          #
          # 为什么单独开一个 job：这条要 Docker + 约 7 分钟，
          # 放在 test job 里会拖慢每次提交的反馈；单开 job 可以与其他 job 并行。
          #
          # 为什么必须常态化：20261116 的 fail-closed 前置检查会让**空库**直接跑链必然失败
          # （实测报 6 条「账号不存在」）—— 这类问题在真机上要等到部署当天才暴露。
          #
          # [FIX 2026-11-11] 失败自动重试一次。
          # 竞态根因已在脚本内修掉（就绪判据从「容器内 socket 版 pg_isready」改成
          # 「按脚本真正要用的方式真连一次」：TCP + 目标库 + 目标账号）；
          # 这里再叠一层重试兜住剩余抖动 —— **真失败仍然失败**（步骤退出码取最后一次），
          # 所以不削弱门禁，只是把「随机红、重跑即绿」收敛掉。
          python scripts/validate_migrations_fresh_db.py || {
            echo "[WARN] 首次执行失败，自动重试一次（根因说明见脚本内 probe_postgres_ready）"
            python scripts/validate_migrations_fresh_db.py
          }

  migration-pg-contract:
    runs-on: ubuntu-latest
    services:
      # 给下面那两个**真正需要现成 PG**的契约用例用。
      # 前 10 个用例不需要它 —— 它们各自自起临时 postgres:15 容器。
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: migration_test_user
          POSTGRES_PASSWORD: migration_test_pass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # [FIX 2026-11-11] 就绪探针走 **TCP**（-h 127.0.0.1），不是容器内默认的 unix socket：
        # 官方 postgres 镜像首次启动会先起一个**只监听 socket** 的临时 server 跑 initdb
        # ⇒ socket 版 pg_isready 会在 initdb 期间就报「就绪」⇒ 后续按 TCP 连库的用例
        # 随机撞上 "the database system is starting up"（表现为随机红、重跑即绿）。
        # health-retries 同步上调（5 → 20），给真启动留足时间。
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U migration_test_user -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      # 这两个文件通过 tests/db_test_config.py 连 PG。该模块**本来就**支持
      # TEST_DB_* 环境变量覆盖、缺省仍是 15432 ⇒ 本地行为完全不变，
      # 这里只是把 CI 指向上面那个临时 PG 服务容器。
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_USER: migration_test_user
      TEST_DB_PASSWORD: migration_test_pass
      TEST_DB_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock.txt ]; then pip install -r requirements.lock.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # pytest 只在 requirements-dev.txt 里（不进生产镜像）。
          # 这个 job 要跑 pytest 用例 => 必须装 dev 依赖，且版本与 test job 一致
          # （pytest==7.4.3 / pytest-asyncio==0.21.1，版本漂移会让 conftest 的
          # session 级 event_loop 覆盖失效）。
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run migration PG contract tests (Docker)
        run: |
          # 「迁移链在真实 PostgreSQL 上的契约守护」。
          #
          # 为什么不需要 postgres service container：这个文件的每个用例**自起**
          # 一个临时 postgres:15 容器（随机空闲端口），并把连接串通过
          # env={**os.environ, "DATABASE_URL": <临时库>} 传给迁移子进程 =>
          # 完全不依赖 127.0.0.1:15432 上的本地 PG，也不依赖环境里的 DATABASE_URL
          # （2026-11-10 本地把 DATABASE_URL 指向不可达地址跑过，10 例全过）。
          #
          # 为什么必须常态化：这里守着 20261215 回填「跳过并记日志」的语义 ——
          # 口径一旦漂移（例如有人把回填谓词放宽），老库升级会重新卡在只读触发器，
          # 而这类问题只有跑在真 PG 上才暴露（2026-11-10 就是靠它抓出来的）。
          #
          # 为什么单独开一个 job：这条要 Docker + 约 4 分钟，放在 test job 里会拖慢
          # 每次提交的反馈；单开 job 与其他 job 并行。
          #
          # 用 python -m 而不是裸 pytest：仓库根必须在 sys.path 上，
          # 否则 import scripts.run_current_schema_migrations 会 collection error。
          #
          # 三个文件两类依赖：
          #   1) 迁移链 PG 契约（自起临时容器）—— 守着 20261215 回填「跳过并记日志」
          #      的语义；口径一旦漂移（例如有人把回填谓词放宽），老库升级会重新卡在
          #      只读触发器，而这类问题只有跑在真 PG 上才暴露。
          #   2) 下面两个走 db_test_config 连本 job 的 PG 服务容器。
          python -m pytest -q --no-header \
            tests/test_current_schema_migration_postgres_contract.py \
            tests/test_collection_config_core_schema_migration_contract.py \
            tests/test_follow_investment_finance_schema_contract.py

  notify:
    runs-on: ubuntu-latest
    needs:
      [
        release-tag-rules,
        test,
        security-scan,
        build-check,
        frontend-guard,
        fresh-db-drill,
        migration-pg-contract,
      ]
    if: always()
    steps:
      - name: Notify results
        run: |
          if [ "${{ needs.release-tag-rules.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.security-scan.result }}" == "success" ] && [ "${{ needs.build-check.result }}" == "success" ] && [ "${{ needs.frontend-guard.result }}" == "success" ] && [ "${{ needs.fresh-db-drill.result }}" == "success" ] && [ "${{ needs.migration-pg-contract.result }}" == "success" ]; then
            echo "[OK] All CI checks passed!"
          else
            echo "[FAIL] Some CI checks failed"
            echo "Release tag rules: ${{ needs.release-tag-rules.result }}"
            echo "Test: ${{ needs.test.result }}"
            echo "Security: ${{ needs.security-scan.result }}"
            echo "Build: ${{ needs.build-check.result }}"
            echo "Frontend guard: ${{ needs.frontend-guard.result }}"
            echo "Fresh DB drill: ${{ needs.fresh-db-drill.result }}"
            echo "Migration PG contract: ${{ needs.migration-pg-contract.result }}"
          fi
