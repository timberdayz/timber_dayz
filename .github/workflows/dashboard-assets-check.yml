name: Dashboard Assets Check

on:
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"

jobs:
  dashboard-assets:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_pass
          POSTGRES_DB: xihong_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user -d xihong_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # [FIX v7.12.9] 先装锁文件（生产运行时依赖的唯一真相源），
          # 再装直接依赖清单与开发依赖清单。
          if [ -f requirements.lock.txt ]; then pip install -r requirements.lock.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Prepare env
        run: |
          if [ -f env.template ]; then
            cp env.template .env
          elif [ -f .env.template ]; then
            cp .env.template .env
          else
            touch .env
          fi
          echo "ENVIRONMENT=development" >> .env
          echo "USE_POSTGRESQL_DASHBOARD_ROUTER=true" >> .env
          # scheme 用 postgresql://（不是 +asyncpg）：同步引擎直接拿这个串建
          # create_engine，asyncpg 驱动会让它抛 InvalidRequestError。
          echo "DATABASE_URL=postgresql://erp_user:erp_pass@127.0.0.1:5432/xihong_erp_ci" >> .env

      - name: SQL hygiene
        run: |
          python scripts/verify_sql_asset_hygiene.py

      - name: Provision schema (空库两段式引导)
        # CI 的 postgres service 是**空库**：没有 core / ops / mart / semantic 等 schema，
        # 脚本 import 时 CREATE TABLE core.field_alias_rules 直接失败
        # （ERROR: schema "core" does not exist）。
        #
        # 仓库已有现成的两段式引导入口 scripts/bootstrap_fresh_environment.py：
        #   第一段升到 20261116 前一个节点 → 注入引导账号 → 第二段升到 head。
        # --allow-gate-profile 是**占位值** profile，脚本自己会打 WARN，
        # 仅允许用于一次性临时库 —— CI 的 service PG 正是这种（真实环境必须走 --manifest）。
        #
        # 实测（本地一次性 postgres:16-alpine，空库）：
        #   两段式引导 exit 0 / 24.7s ⇒ 随后的看板资产引导 exit 0、ready: True。
        env:
          DATABASE_URL: postgresql://erp_user:erp_pass@127.0.0.1:5432/xihong_erp_ci
        run: |
          python scripts/bootstrap_fresh_environment.py --allow-gate-profile

      - name: Bootstrap dashboard assets
        # DATABASE_URL 必须走**环境变量**，不能只写进 .env：
        #
        # scripts/bootstrap_postgresql_dashboard.py 直接 import
        # backend.models.database，而全仓**只有 backend/main.py** 会调
        # load_project_env(project_root) ⇒ .env 里的 DATABASE_URL 从来没被读过
        # ⇒ 回落到 backend/utils/config.py 的默认值 localhost:15432
        # ⇒ Connection refused（本工作流 11-04 才加入、只在 pull_request 触发，
        #   2026-11-10 之前从未运行过 ⇒ 这条链路是第一次被真正跑到）。
        #
        # scheme 用 postgresql://（不是 +asyncpg）：同步引擎直接拿这个串建
        # create_engine，asyncpg 驱动会让它抛 InvalidRequestError；
        # 异步引擎由 get_async_database_url 自动换成 postgresql+asyncpg://。
        env:
          DATABASE_URL: postgresql://erp_user:erp_pass@127.0.0.1:5432/xihong_erp_ci
        run: |
          python scripts/bootstrap_postgresql_dashboard.py

