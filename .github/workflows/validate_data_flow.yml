name: Validate Data Flow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-api-contracts:
    name: Validate API Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # [FIX v7.12.9] 依赖单一真相源：
          # requirements.lock.txt 是完整传递依赖闭包（全部 == 钉死），先装它，
          # CI 与生产镜像解析到同一套版本；requirements.txt 只是运行时直接依赖清单。
          if [ -f requirements.lock.txt ]; then pip install -r requirements.lock.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create temp directory
        run: mkdir -p temp

      - name: Validate API Contracts
        run: python scripts/validate_api_contracts.py

      - name: Validate Frontend API Methods
        run: python scripts/validate_frontend_api_methods.py

      - name: Validate Database Fields
        run: python scripts/validate_database_fields.py

      - name: Generate Code Review Checklist
        run: |
          python scripts/generate_code_review_checklist.py || echo "Code review checklist generation completed"

      - name: Upload Validation Reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: validation-reports
          path: |
            temp/code_review_checklist_report.txt
            temp/validation_*.txt
          if-no-files-found: ignore

  validate-materialized-views:
    name: Validate Materialized Views
    runs-on: ubuntu-latest
    # 物化视图验证需要完整数据库环境，在 CI 中标记为可选
    continue-on-error: true
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        # [FIX 2026-11-11] 就绪探针走 **TCP**（-h 127.0.0.1），不是容器内默认的 unix socket：
        # 官方 postgres 镜像首次启动会先起一个**只监听 socket** 的临时 server 跑 initdb
        # ⇒ socket 版 pg_isready 会在 initdb 期间就报「就绪」⇒ 后续按 TCP 连库的用例
        # 随机撞上 "the database system is starting up"。health-retries 上调（5 → 20）。
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # [FIX v7.12.9] 依赖单一真相源：
          # requirements.lock.txt 是完整传递依赖闭包（全部 == 钉死），先装它，
          # CI 与生产镜像解析到同一套版本；requirements.txt 只是运行时直接依赖清单。
          if [ -f requirements.lock.txt ]; then pip install -r requirements.lock.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          echo "Note: Materialized view validation requires initialized database tables"
          echo "This validation is optional in CI environment"
          echo "Database setup completed"

      - name: Validate Materialized View Fields
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          python scripts/test_materialized_view_fields.py || echo "Materialized view validation skipped (requires initialized database)"
