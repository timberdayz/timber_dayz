# ============================================================================
# READ-ONLY HISTORICAL CHAIN -- this is NOT the current source of truth.
# ============================================================================
#
# The one current migration chain is **alembic-current.ini** -> current_migrations/,
# versioned by `public.current_schema_alembic_version`.
#
#   Deploy / startup / verification always run:
#       python -m alembic -c alembic-current.ini upgrade head
#   (The production image ships only alembic-current.ini + current_migrations/;
#    this file and migrations/ are NOT in the image.)
#
# Why this file still exists: several contract tests read the historical chain
# directly (its migrations are the static origin of certain calibers).
# Deleting it would mean rewriting a lot of historical contracts.
#
# WARNING: do NOT run a bare `alembic upgrade head` (no `-c alembic-current.ini`).
#   It would take this read-only chain, advance `core.alembic_version`, and may
#   run old migrations that conflict with the current structure. The first
#   historical revision already fails on a modern database ("table already
#   exists") and rolls back, but the version table has moved by then.
#
# `core.alembic_version` is kept on purpose on both sides: on production it is
# the provenance marker of the current baseline
# (20260805_payroll_backfill_audit), on the dev database it is the historical
# chain's progress marker. Do not drop either.
#
# NOTE: keep this file ASCII-only -- alembic parses it with the locale codec
# (GBK on Windows), so UTF-8 non-ASCII comments break `alembic` outright.
# The Chinese explanation lives in current_migrations/README.md.

# Alembic config - XiHong ERP

[alembic]
script_location = migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# sqlalchemy.url = postgresql://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

