# 西虹ERP系统 - 开发环境 Docker Compose 配置
# 用于本地开发，启用热重载和调试功能
# 使用方式: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# 环境变量优先级: .env < .env.development（后者覆盖前者，若存在）
# 建议复制 env.example 为 .env，env.development.example 为 .env.development

services:
  # 开发环境数据库配置覆盖
  # 统一使用与生产环境相同的数据库配置，避免数据库连接混乱
  postgres:
    command:
      - postgres
      - -c
      - statement_timeout=120s
      - -c
      - work_mem=32MB
      - -c
      - shared_buffers=512MB
      - -c
      - max_parallel_workers_per_gather=4
    ports:
      # 使用 15432 端口避免与本地 PostgreSQL 冲突
      # 容器内部仍使用 5432 端口，容器间通信使用服务名 postgres:5432
      - "15432:5432"

  # 后端开发配置（可选，通常本地运行）
  backend-api: &backend_api_service
    build:
      context: .
      dockerfile: Dockerfile.backend
      # Dockerfile.backend 没有定义 development stage，移除 target
      # 开发环境主要靠 volumes 挂载源代码实现热重载
    container_name: xihong_erp_backend_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://erp_user:erp_pass_2025@postgres:5432/xihong_erp
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY}
      RUN_MIGRATIONS: "0"
      DEPLOYMENT_ROLE: "api"
      # 版本号：与生产同口径（生产由流水线注入 IMAGE_TAG）。
      # 留空则回落到挂载进来的 VERSION 文件 —— 否则容器会一直显示**镜像构建时**的版本号，
      # 而本地代码已经是新版本，排查问题时极易误判成"跑的是旧版本"。
      APP_VERSION: ${APP_VERSION:-}
      DATABASE_ECHO: "true"
      DEBUG: "true"
      APP_ENV: development
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:8001,http://127.0.0.1:8001}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},backend
      PROJECT_ROOT: /app
      DATA_DIR: /app/data
      DATA_RAW_DIR: /app/data/raw
    volumes:
      - ./backend:/app/backend
      - ./modules:/app/modules
      - ./models:/app/models
      - ./migrations:/app/migrations
      # current-schema 迁移链必须挂宿主机目录：
      # 镜像里的 current_migrations 是构建时的快照，仓库新增迁移后镜像就会过期，
      # 容器内迁移白名单会把当前 revision 判成"不受支持的版本"并 fail-closed 拒绝写入。
      - ./current_migrations:/app/current_migrations
      - ./sql:/app/sql
      - ./tools:/app/tools
      - ./profiles:/app/profiles
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp:/app/temp
      # 版本号文件必须挂宿主机目录：镜像里的 VERSION 是构建时的快照，
      # 不挂的话容器会一直显示构建时的旧版本号，而本地代码其实已经是新版本。
      - ./VERSION:/app/VERSION:ro
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      erp_network:
        aliases:
          - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev-full

  backend-collector:
    <<: *backend_api_service
    container_name: xihong_erp_backend_collector
    environment:
      DATABASE_URL: postgresql://erp_user:erp_pass_2025@postgres:5432/xihong_erp
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY}
      RUN_MIGRATIONS: "0"
      DEPLOYMENT_ROLE: "collector"
      # 店铺身份「保未来」三件套(空默认 = 未启用, 不会误报)
      SHOP_IDENTITY_ALIGNMENT_EFFECTIVE_DATE: ${SHOP_IDENTITY_ALIGNMENT_EFFECTIVE_DATE:-}
      SHOP_IDENTITY_SEMANTIC_UNKNOWN_RATE_THRESHOLD: ${SHOP_IDENTITY_SEMANTIC_UNKNOWN_RATE_THRESHOLD:-}
      SHOP_IDENTITY_CONFLICT_NOTIFY_ENABLED: ${SHOP_IDENTITY_CONFLICT_NOTIFY_ENABLED:-}
      # 版本号：与生产同口径（生产由流水线注入 IMAGE_TAG）；留空则回落到 VERSION 文件。
      APP_VERSION: ${APP_VERSION:-}
      APP_RUNTIME_MODE: "collector"
      ENABLE_COLLECTION: "true"
      DATABASE_ECHO: "true"
      DEBUG: "true"
      APP_ENV: development
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:8001,http://127.0.0.1:8001}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},backend
      PROJECT_ROOT: /app
      DATA_DIR: /app/data
      DATA_RAW_DIR: /app/data/raw
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports: []
    profiles:
      - collection

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xihong_erp_migrate
    restart: "no"
    command: python /app/scripts/run_current_schema_migrations.py
    environment:
      DATABASE_URL: postgresql://erp_user:erp_pass_2025@postgres:5432/xihong_erp
      RUN_MIGRATIONS: "0"
      CURRENT_SCHEMA_SOURCE_REVISION: ${CURRENT_SCHEMA_SOURCE_REVISION:-}
      CURRENT_SCHEMA_SOURCE_FINGERPRINT: ${CURRENT_SCHEMA_SOURCE_FINGERPRINT:-}
      APP_ENV: development
    volumes:
      - ./backend:/app/backend
      - ./modules:/app/modules
      - ./migrations:/app/migrations
      - ./current_migrations:/app/current_migrations
      - ./sql:/app/sql
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp_network
    profiles:
      - dev-full

  # 前端开发配置（可选，通常本地运行）
  # 生产构建必须在 CI 中设置 VITE_API_URL，否则会指向 localhost
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5173/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - dev-full

  # Redis 缓存（开发环境）
  redis:
    image: redis:7-alpine
    container_name: xihong_erp_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --requirepass ${REDIS_PASSWORD:-redis_pass_2025}
    stop_grace_period: 30s
    volumes:
      - redis_data_dev:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - erp_network
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - dev
      - dev-full

  # Celery Worker（开发环境）
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      # Dockerfile.backend 没有定义 development stage，移除 target
      # 开发环境主要靠 volumes 挂载源代码实现热重载
    container_name: xihong_erp_celery_worker
    restart: unless-stopped
    command: celery -A backend.celery_app worker --loglevel=info --queues=data_sync,scheduled,data_processing,refresh_queue --concurrency=4
    environment:
      DATABASE_URL: postgresql://erp_user:erp_pass_2025@postgres:5432/xihong_erp
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      RUN_MIGRATIONS: "0"
      APP_ENV: development
      DEBUG: "true"
      PROJECT_ROOT: /app
      DATA_DIR: /app/data
      DATA_RAW_DIR: /app/data/raw
      # 版本号：与生产同口径（生产由流水线注入 IMAGE_TAG）；留空则回落到 VERSION 文件。
      APP_VERSION: ${APP_VERSION:-}
      # 云端巡检连接（2026-11-07 事故后补齐）。
      # compose 只负责把变量**传进容器**；主机名重写由代码负责
      # （backend/tasks/cloud_sync_integrity_tasks.py 的 normalize_cloud_database_url）。
      # 原因：采集机的 CLOUD_DATABASE_URL 指向宿主上的 SSH 隧道(127.0.0.1:15433)，
      # 而容器里的 127.0.0.1 是**容器自己**，原样透传必然 Connection refused。
      # 留空是有意的：没配 CLOUD_DATABASE_URL 时巡检照旧跳过。
      CLOUD_DATABASE_URL: ${CLOUD_DATABASE_URL:-}
      CLOUD_SYNC_TUNNEL_ENABLED: ${CLOUD_SYNC_TUNNEL_ENABLED:-true}
      # ⚠️ **刻意不插值**（2026-11-11 修复）：容器里的隧道宿主**恒为** host.docker.internal。
      # 之前写成 ${CLOUD_SYNC_TUNNEL_HOST:-host.docker.internal} 会被**宿主进程的环境变量**
      # 覆盖 —— 采集机的宿主进程与容器**共用同一个变量名**，而两者语义**相反**：
      #   · 宿主进程：127.0.0.1 就是宿主自己 ⇒ 隧道地址就该是 127.0.0.1
      #   · 容器内  ：127.0.0.1 是**容器自己** ⇒ 隧道地址必须是 host.docker.internal
      # compose 插值**优先取进程环境变量** ⇒ 宿主进程把 127.0.0.1 带进容器
      # ⇒ 容器里的云端巡检恒为「云端不可达」⇒ 假警报把真信号淹掉。
      CLOUD_SYNC_TUNNEL_HOST: host.docker.internal
      CLOUD_SYNC_TUNNEL_PORT: ${CLOUD_SYNC_TUNNEL_PORT:-15433}
      # 店铺身份「保未来」三件套(空默认 = 未启用, 不会误报)
      SHOP_IDENTITY_ALIGNMENT_EFFECTIVE_DATE: ${SHOP_IDENTITY_ALIGNMENT_EFFECTIVE_DATE:-}
      SHOP_IDENTITY_SEMANTIC_UNKNOWN_RATE_THRESHOLD: ${SHOP_IDENTITY_SEMANTIC_UNKNOWN_RATE_THRESHOLD:-}
      SHOP_IDENTITY_CONFLICT_NOTIFY_ENABLED: ${SHOP_IDENTITY_CONFLICT_NOTIFY_ENABLED:-}
    volumes:
      - ./backend:/app/backend
      - ./modules:/app/modules
      - ./migrations:/app/migrations
      - ./current_migrations:/app/current_migrations
      - ./sql:/app/sql
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp:/app/temp
      # 版本号文件必须挂宿主机目录：镜像里的 VERSION 是构建时的快照，
      # 不挂的话容器会一直显示构建时的旧版本号，而本地代码其实已经是新版本。
      - ./VERSION:/app/VERSION:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - erp_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A backend.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - dev-full

  # Celery Beat（开发环境自动同步调度）
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xihong_erp_celery_beat
    restart: unless-stopped
    command: celery -A backend.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://erp_user:erp_pass_2025@postgres:5432/xihong_erp
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379/0
      RUN_MIGRATIONS: "0"
      APP_ENV: development
      DEBUG: "true"
      PROJECT_ROOT: /app
      DATA_DIR: /app/data
      DATA_RAW_DIR: /app/data/raw
      # 版本号：与生产同口径（生产由流水线注入 IMAGE_TAG）；留空则回落到 VERSION 文件。
      APP_VERSION: ${APP_VERSION:-}
      # 云端巡检连接（2026-11-07 事故后补齐）。
      # compose 只负责把变量**传进容器**；主机名重写由代码负责
      # （backend/tasks/cloud_sync_integrity_tasks.py 的 normalize_cloud_database_url）。
      # 原因：采集机的 CLOUD_DATABASE_URL 指向宿主上的 SSH 隧道(127.0.0.1:15433)，
      # 而容器里的 127.0.0.1 是**容器自己**，原样透传必然 Connection refused。
      # 留空是有意的：没配 CLOUD_DATABASE_URL 时巡检照旧跳过。
      CLOUD_DATABASE_URL: ${CLOUD_DATABASE_URL:-}
      CLOUD_SYNC_TUNNEL_ENABLED: ${CLOUD_SYNC_TUNNEL_ENABLED:-true}
      # ⚠️ **刻意不插值**（2026-11-11 修复）：容器里的隧道宿主**恒为** host.docker.internal。
      # 之前写成 ${CLOUD_SYNC_TUNNEL_HOST:-host.docker.internal} 会被**宿主进程的环境变量**
      # 覆盖 —— 采集机的宿主进程与容器**共用同一个变量名**，而两者语义**相反**：
      #   · 宿主进程：127.0.0.1 就是宿主自己 ⇒ 隧道地址就该是 127.0.0.1
      #   · 容器内  ：127.0.0.1 是**容器自己** ⇒ 隧道地址必须是 host.docker.internal
      # compose 插值**优先取进程环境变量** ⇒ 宿主进程把 127.0.0.1 带进容器
      # ⇒ 容器里的云端巡检恒为「云端不可达」⇒ 假警报把真信号淹掉。
      CLOUD_SYNC_TUNNEL_HOST: host.docker.internal
      CLOUD_SYNC_TUNNEL_PORT: ${CLOUD_SYNC_TUNNEL_PORT:-15433}
      # 店铺身份「保未来」三件套(空默认 = 未启用, 不会误报)
      SHOP_IDENTITY_ALIGNMENT_EFFECTIVE_DATE: ${SHOP_IDENTITY_ALIGNMENT_EFFECTIVE_DATE:-}
      SHOP_IDENTITY_SEMANTIC_UNKNOWN_RATE_THRESHOLD: ${SHOP_IDENTITY_SEMANTIC_UNKNOWN_RATE_THRESHOLD:-}
      SHOP_IDENTITY_CONFLICT_NOTIFY_ENABLED: ${SHOP_IDENTITY_CONFLICT_NOTIFY_ENABLED:-}
    volumes:
      - ./backend:/app/backend
      - ./modules:/app/modules
      - ./sql:/app/sql
      - ./migrations:/app/migrations
      - ./current_migrations:/app/current_migrations
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp:/app/temp
      # 版本号文件必须挂宿主机目录：镜像里的 VERSION 是构建时的快照，
      # 不挂的话容器会一直显示构建时的旧版本号，而本地代码其实已经是新版本。
      - ./VERSION:/app/VERSION:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - erp_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, redis; r=redis.from_url(os.environ['CELERY_BROKER_URL']); r.ping(); print('ok')",
        ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    profiles:
      - dev-full

  # Nginx 反向代理（开发环境测试）
  nginx:
    image: nginx:alpine
    container_name: xihong_erp_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "8081:80"
    networks:
      - erp_network
    profiles:
      - dev-nginx
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.25"
          memory: 64M

volumes:
  redis_data_dev:
    driver: local
    name: xihong_erp_redis_data
