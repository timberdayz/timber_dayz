# ⭐ v4.19.5 更新：移除 version 字段（Docker Compose v2 已废弃）
services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: xihong_erp_postgres
    # A3: 显式注入 -c 参数。
    # 之前 prod overlay 没有 command 段，compose merge 把 base 的 command 整体替换为空，
    # 导致生产实际拿不到 statement_timeout / work_mem / shared_buffers / max_parallel_workers_per_gather，
    # 静默回退到镜像默认（statement_timeout=0、work_mem=4MB、shared_buffers=128MB）。
    #
    # 2026-11-05：PG 内存收口（宿主机 7.4 GiB，openclaw 常驻 2.8 GiB，swap 0）。
    #   work_mem 32MB→8MB、shared_buffers 512MB→256MB、effective_cache_size 4GB→2GB、
    #   max_connections 100→80。
    #   原因：work_mem × max_connections 的理论峰值曾是 32MB×100 = 3.2 GiB，
    #   而 PG 容器上限只有 1.5 GiB ⇒ PG 已被 OOMKill 过（连接被重置 → nginx 记 502）。
    #   收口后理论峰值 8MB×80 = 640 MiB，实测 PG 常驻从 716 MiB 降到 356 MiB。
    #   effective_cache_size 4GB 与宿主机实际 buff/cache（2.1 GiB）严重不符，
    #   会误导优化器选「能全放内存」的激进计划；改成 2GB 后计划更贴近现实。
    #
    # 2026-11-09：max_connections 80→200，work_mem 8MB→4MB。
    #   原因：生产实测连接数打满 80/80，应用拿不到连接 ⇒ 请求直接失败（502）。
    #         连接数上限本身是事故的直接诱因，80 太小。
    #   为什么必须同时降 work_mem：PG 容器的**生效**上限是 1.5 GiB
    #   （来自 docker-compose.cloud.yml，它叠在 prod overlay 之后 ⇒ 覆盖这里的 4G），
    #   而 work_mem × max_connections 的理论峰值必须留在 1024 MB 安全线内
    #   （tests/test_verify_remote_deploy_contracts.py 有门禁）：
    #     8MB × 200 = 1600 MB > 1536 MB 上限 ⇒ 又会被 OOMKill；
    #     4MB × 200 = 800 MB ✓（叠加 shared_buffers 256MB 仍在 1.5 GiB 内）。
    #   代价：单次排序/哈希可用内存减半 ⇒ 大聚合查询更容易溢写磁盘（变慢，不报错）。
    #   ⚠️ 这只是**争取时间**：连接泄漏不修，200 一样会被打满，
    #      根治必须落在代码侧（连接归还 + 池回收）。
    command:
      - postgres
      - -c
      - statement_timeout=120s
      - -c
      - work_mem=4MB
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=2GB
      - -c
      - max_connections=200
      - -c
      - max_parallel_workers_per_gather=4
    restart: always
    # [LOG ROTATION] 容器日志必须有上限：json-file 默认不轮转，
    #   一次连接风暴就能把宿主机磁盘写满（生产 access.log 51MB / error.log 106MB 已出现过）。
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xihong_erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    ports:
      - "127.0.0.1:15435:5432"
    # 生产最小端口暴露：仅绑定宿主机回环，供 SSH tunnel / 运维调试使用。
    networks:
      - erp_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-xihong_erp}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          # 2026-11-04：1.5~2G 上限曾把 PG OOMKill 过（实测线上容器上限 1.5GiB、
          # 存量 shared_buffers=512MB + work_mem=32MB×4 并行 worker）。
          # 业务概览的重分析查询（大窗口 GROUP BY + 排序）瞬时占用很高，
          # 内存不够时 PG 被内核杀掉 → 连接被重置 → nginx 记 502。
          # 放宽到 4G 给重查询留余量；数据在 volume 里，重建容器不丢数据。
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G
    profiles:
      - production
      - full

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: xihong_erp_redis
    restart: always
    # [LOG ROTATION] 见 postgres 段说明：json-file 必须带上限，否则日志撑爆磁盘。
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # 生产最小端口暴露：redis 不映射宿主机端口（仅容器网络可访问）
    networks:
      - erp_network
    healthcheck:
      # ⭐ v4.19.5 修复：健康检查需要提供密码（支持默认值）
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    profiles:
      - production
      - full

  # FastAPI后端
  backend-api: &backend_api_service
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - ENVIRONMENT=production
    container_name: xihong_erp_backend_api
    restart: always
    # [LOG ROTATION] 见 postgres 段说明：json-file 必须带上限，否则日志撑爆磁盘。
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # 数据库配置
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xihong_erp}

      # Redis配置
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # 账号会话锁后端（Task 3）：同一主账号的持久 profile 目录不能被两个进程同时打开
      # → 锁必须跨进程（Redis SET NX）。显式指定 Redis，不再依赖 ENVIRONMENT 的隐式推断。
      ACCOUNT_SESSION_LOCK_BACKEND: ${ACCOUNT_SESSION_LOCK_BACKEND:-redis}

      # 安全配置
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # 应用配置
      ENVIRONMENT: "production"
      APP_ENV: production
      RUN_MIGRATIONS: "0"
      DEPLOYMENT_ROLE: "api"
      DEBUG: "false"
      LOG_LEVEL: INFO
      APP_VERSION: ${IMAGE_TAG}
      USE_POSTGRESQL_DASHBOARD_ROUTER: ${USE_POSTGRESQL_DASHBOARD_ROUTER:-true}
      # Avoid concurrent startup bootstrap deadlocks; bootstrap runs as an explicit deploy step.
      AUTO_BOOTSTRAP_DASHBOARD_ASSETS_ON_STARTUP: ${AUTO_BOOTSTRAP_DASHBOARD_ASSETS_ON_STARTUP:-false}
      # ⚠️ 重要：ALLOWED_HOSTS 必须包含 'backend'（Nginx 代理时设置的 Host 头）
      # 生产环境建议通过 .env 文件明确配置：ALLOWED_HOSTS=localhost,127.0.0.1,backend,your-domain.com
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},backend

      # ⭐ 路径配置（Linux服务器部署必需）
      PROJECT_ROOT: /app
      DATA_DIR: /app/data
      DATA_RAW_DIR: /app/data/raw
      DOWNLOADS_DIR: /app/downloads
      TEMP_DIR: /app/temp
      LOGS_DIR: /app/logs

      # 数据库连接池配置
      DB_POOL_SIZE: 4
      DB_MAX_OVERFLOW: 4
      DB_POOL_TIMEOUT: 30
      DB_POOL_RECYCLE: 3600
      CPU_EXECUTOR_WORKERS: 2
      IO_EXECUTOR_WORKERS: 8
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./uploads:/app/uploads
      # 持久化 Profile 目录（登录态的唯一载体）：必须挂到宿主机，
      # 否则容器一重建，所有账号的 Chromium 登录态全部丢失（每次都要重新人工登录 + 过验证码）
      - ./profiles:/app/profiles
    # 防御性配置：生产当前用的是内网服务名 redis:6379（不依赖 host.docker.internal），
    # 但若将来把 REDIS_URL 指回宿主，Linux 上没有这条映射会解析失败 → 账号会话锁
    # 静默降级为进程内锁（跨进程保护失效）。host-gateway 需要 Docker 20.10+。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 生产最小端口暴露：backend 不映射宿主机端口（通过 nginx 反向代理访问 /api/）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      erp_network:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    profiles:
      - production
      - full

  backend-collector:
    <<: *backend_api_service
    container_name: xihong_erp_backend_collector
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xihong_erp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # 账号会话锁后端（Task 3）：显式指定 Redis，不再依赖 ENVIRONMENT 的隐式推断
      ACCOUNT_SESSION_LOCK_BACKEND: ${ACCOUNT_SESSION_LOCK_BACKEND:-redis}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ENVIRONMENT: "production"
      APP_ENV: production
      RUN_MIGRATIONS: "0"
      DEPLOYMENT_ROLE: "collector"
      APP_RUNTIME_MODE: "collector"
      ENABLE_COLLECTION: "true"
      CLOUD_SYNC_WORKER_ENABLED: ${CLOUD_SYNC_WORKER_ENABLED:-false}
      CLOUD_SYNC_WORKER_ID: ${CLOUD_SYNC_WORKER_ID:-cloud-sync-worker-1}
      CLOUD_SYNC_POLL_INTERVAL_SECONDS: ${CLOUD_SYNC_POLL_INTERVAL_SECONDS:-5}
      CLOUD_DATABASE_URL: ${CLOUD_DATABASE_URL:-}
      CLOUD_SYNC_TUNNEL_ENABLED: ${CLOUD_SYNC_TUNNEL_ENABLED:-false}
      CLOUD_SYNC_TUNNEL_HOST: ${CLOUD_SYNC_TUNNEL_HOST:-}
      CLOUD_SYNC_TUNNEL_PORT: ${CLOUD_SYNC_TUNNEL_PORT:-}
      DEBUG: "false"
      LOG_LEVEL: INFO
      APP_VERSION: ${IMAGE_TAG}
      USE_POSTGRESQL_DASHBOARD_ROUTER: ${USE_POSTGRESQL_DASHBOARD_ROUTER:-true}
      AUTO_BOOTSTRAP_DASHBOARD_ASSETS_ON_STARTUP: ${AUTO_BOOTSTRAP_DASHBOARD_ASSETS_ON_STARTUP:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},backend
      PROJECT_ROOT: /app
      DATA_DIR: /app/data
      DATA_RAW_DIR: /app/data/raw
      DOWNLOADS_DIR: /app/downloads
      TEMP_DIR: /app/temp
      LOGS_DIR: /app/logs
      DB_POOL_SIZE: 4
      DB_MAX_OVERFLOW: 4
      DB_POOL_TIMEOUT: 30
      DB_POOL_RECYCLE: 3600
      CPU_EXECUTOR_WORKERS: 2
      IO_EXECUTOR_WORKERS: 8
    ports: []
    profiles:
      - collector


  # Vue.js前端
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - ENVIRONMENT=production
    container_name: xihong_erp_migrate
    restart: "no"
    command: python /app/scripts/run_current_schema_migrations.py
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      RUN_MIGRATIONS: "0"
      ENVIRONMENT: "production"
      APP_ENV: production
      APP_VERSION: ${IMAGE_TAG}
      CURRENT_SCHEMA_SOURCE_REVISION: ${CURRENT_SCHEMA_SOURCE_REVISION:-}
      CURRENT_SCHEMA_SOURCE_FINGERPRINT: ${CURRENT_SCHEMA_SOURCE_FINGERPRINT:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp_network
    profiles:
      - production
      - full

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: xihong_erp_frontend
    restart: always
    # [LOG ROTATION] 见 postgres 段说明：json-file 必须带上限，否则日志撑爆磁盘。
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # 生产最小端口暴露：frontend 不映射宿主机端口（通过 nginx 反向代理访问 /）
    # 明确清空端口映射，确保生产环境不暴露端口
    ports: [] # 清空端口映射，服务仍可通过 frontend:80 在容器网络内访问
    depends_on:
      - backend-api
    networks:
      - erp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    profiles:
      - production
      - full

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: xihong_erp_nginx
    restart: always
    # [LOG ROTATION] 见 postgres 段说明：json-file 必须带上限，否则日志撑爆磁盘。
    # ⚠️ 注意：nginx 自己的 access/error log 写的是文件（/var/log/nginx/*.log，挂了宿主机 ./logs），
    #    不走容器 stdout ⇒ 这里的 json-file 轮转**管不到那两个文件**，
    #    文件日志还需要 logrotate 之类单独处理。
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend-api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - erp_network
    # 健康检查改为 / 避免因 /health 代理 502 导致 Nginx 反复重启；/ 代理到 frontend 通常已就绪
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "--quiet",
          "--tries=1",
          "--output-document=/dev/null",
          "https://127.0.0.1/",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
    profiles:
      - production
      - full

  # Celery Worker（异步任务处理）
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - ENVIRONMENT=production
    container_name: xihong_erp_celery_worker
    restart: always
    # [LOG ROTATION] 见 postgres 段说明：json-file 必须带上限，否则日志撑爆磁盘。
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # ⚠️ 重要：必须指定队列和并发数，与 backend/celery_app.py 中的配置一致
    # 队列说明：
    # - data_sync: 数据同步任务（主要业务任务）
    # - scheduled: 定时任务（由 Celery Beat 调度）
    # - data_processing: 数据处理任务（可选，如果不需要可以移除）
    command: celery -A backend.celery_app worker --loglevel=info --queues=data_sync,scheduled,data_processing,refresh_queue --concurrency=4
    # 双保险：既读服务器上的 .env 文件，又用 environment 插值覆盖。
    # env_file 兜住「.env.cleaned 没生成/变量被清掉」的情况，
    # environment 兜住「.env 文件里有 CRLF 或引号导致值不干净」的情况。
    # ⚠️ environment 优先级高于 env_file，所以 DATABASE_URL 等仍走插值（容器网络地址），
    #    不会退回 env_file 里的 localhost 值。
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # ⚠️ 重要：Celery 使用 CELERY_BROKER_URL 和 CELERY_RESULT_BACKEND，不是 REDIS_URL
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: "production"
      APP_ENV: production
      RUN_MIGRATIONS: "0"
      APP_VERSION: ${IMAGE_TAG}
      # ── 飞书投影凭据（2026-11-22 补）────────────────────────────
      # ⚠️ 为什么必须显式注入：celery-worker **只定义在本 overlay 里**
      #    （base 的 docker-compose.yml 没有这个 service），所以它拿不到
      #    base 里 backend-api 用的 env_file: .env。
      #    compose 的 env_file / environment 都不会自动把 .env 灌进容器，
      #    不显式给 ⇒ 跑飞书投影任务的 celery 容器没有凭据 ⇒
      #    任务直接失败（"Feishu app credentials are not configured"）。
      #    现象：最后一次成功投影停在 2026-11-01，之后的 price_adjust 任务全失败。
      #
      # ⚠️ 这里**只加 env_file、不在 environment 里重复声明** FEISHU_*：
      #    environment 的优先级**高于** env_file，一旦在 environment 里写
      #    `FEISHU_PRODUCT_APP_ID: ${FEISHU_PRODUCT_APP_ID:-}`，插不出值时
      #    会用**空串覆盖** env_file 里的真值 ⇒ 白修一场。
      #    下面的 DATABASE_URL 等仍然留在 environment（容器网络地址），
      #    env_file 里的 localhost 值被正确压住，互不打架。
      #
      # 上面的 env_file 段负责这批凭据。
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 2
      CPU_EXECUTOR_WORKERS: 1
      IO_EXECUTOR_WORKERS: 4
      # ── 云端巡检连接（2026-11-11 补）──────────────────────────────────
      # 巡检要看的「云端」在生产上就是**自己** ⇒ CLOUD_DATABASE_URL 应当指向
      # 生产库(容器网络地址)。不配 ⇒ 巡检永远 skipped ⇒
      # 「云端停更没人知道」会重演(2026-11-07 事故的直接成因)。
      # ⚠️ 主机名重写由代码负责(backend/tasks/cloud_sync_integrity_tasks.py 的
      #    normalize_cloud_database_url)，compose 只负责把变量传进容器。
      CLOUD_DATABASE_URL: ${CLOUD_DATABASE_URL:-}
      # ── 店铺身份「保未来」三件套（2026-11-11）─────────────────────────
      # 全部留空默认 = 未启用：生效日没配 ⇒ 语义层 unknown 全归「已知历史遗留」
      # ⇒ 巡检安静但**不会误报**。三项含义:
      #   SHOP_IDENTITY_ALIGNMENT_EFFECTIVE_DATE      对齐生效日(按月分档)
      #   SHOP_IDENTITY_SEMANTIC_UNKNOWN_RATE_THRESHOLD 认不出占比阈值(0=有一行就报)
      #   SHOP_IDENTITY_CONFLICT_NOTIFY_ENABLED        矛盾行通知开关(同步侧用)
      SHOP_IDENTITY_ALIGNMENT_EFFECTIVE_DATE: ${SHOP_IDENTITY_ALIGNMENT_EFFECTIVE_DATE:-}
      SHOP_IDENTITY_SEMANTIC_UNKNOWN_RATE_THRESHOLD: ${SHOP_IDENTITY_SEMANTIC_UNKNOWN_RATE_THRESHOLD:-}
      SHOP_IDENTITY_CONFLICT_NOTIFY_ENABLED: ${SHOP_IDENTITY_CONFLICT_NOTIFY_ENABLED:-}
      # ⭐ 路径配置（与后端服务保持一致）
      PROJECT_ROOT: /app
      DATA_DIR: /app/data
      DATA_RAW_DIR: /app/data/raw
      DOWNLOADS_DIR: /app/downloads
      TEMP_DIR: /app/temp
      LOGS_DIR: /app/logs
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - erp_network
    # ⚠️ 重要：添加健康检查，确保 Worker 正常运行
    # 使用 Redis 连接检查（更可靠），验证 Celery 能否连接到 broker
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A backend.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    profiles:
      - production
      - full

  # Celery Beat（定时任务）
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - ENVIRONMENT=production
    container_name: xihong_erp_celery_beat
    restart: always
    # [LOG ROTATION] 见 postgres 段说明：json-file 必须带上限，否则日志撑爆磁盘。
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    command: celery -A backend.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # ⚠️ 重要：Celery 使用 CELERY_BROKER_URL 和 CELERY_RESULT_BACKEND，不是 REDIS_URL
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_VERSION: ${IMAGE_TAG}
      USE_POSTGRESQL_DASHBOARD_ROUTER: ${USE_POSTGRESQL_DASHBOARD_ROUTER:-false}
      RUN_MIGRATIONS: "0"
      # ── 云端巡检连接（2026-11-11 补）──────────────────────────────────
      # 与 celery-worker 保持**完全一致**的云端配置:
      # worker 与 beat 必须拿到同一份, 否则会出现「beat 调度了、worker 却跳过」。
      CLOUD_DATABASE_URL: ${CLOUD_DATABASE_URL:-}
      # 店铺身份「保未来」三件套(空默认 = 未启用, 不会误报)
      SHOP_IDENTITY_ALIGNMENT_EFFECTIVE_DATE: ${SHOP_IDENTITY_ALIGNMENT_EFFECTIVE_DATE:-}
      SHOP_IDENTITY_SEMANTIC_UNKNOWN_RATE_THRESHOLD: ${SHOP_IDENTITY_SEMANTIC_UNKNOWN_RATE_THRESHOLD:-}
      SHOP_IDENTITY_CONFLICT_NOTIFY_ENABLED: ${SHOP_IDENTITY_CONFLICT_NOTIFY_ENABLED:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - erp_network
    # ⚠️ 重要：添加健康检查，确保 Beat 正常运行；放宽间隔与 start_period 减少误判重启
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, redis; r=redis.from_url(os.environ['CELERY_BROKER_URL']); r.ping(); print('ok')",
        ]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    profiles:
      - production
      - full

  # Celery Exporter（监控指标导出）
  # ⚠️ 注意：ovalmoney/celery-exporter 默认监听 9540 端口
  celery-exporter:
    image: ovalmoney/celery-exporter:latest
    container_name: xihong_erp_celery_exporter
    restart: always
    # 生产最小端口暴露：celery-exporter 不映射宿主机端口（监控侧在容器网络内抓取）
    environment:
      # ⚠️ ovalmoney/celery-exporter 使用 CELERY_EXPORTER_BROKER_URL 环境变量
      CELERY_EXPORTER_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - erp_network
    healthcheck:
      # ⚠️ 容器内部监听 9540 端口，使用 Python 进行健康检查（wget 在 Alpine 中有兼容性问题）
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9540/metrics', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    profiles:
      - production
      - full

networks:
  erp_network:
    driver: bridge
    name: xihong_erp_erp_network

volumes:
  postgres_data:
    driver: local
    name: xihong_erp_postgres_data
  redis_data:
    driver: local
    name: xihong_erp_redis_data
