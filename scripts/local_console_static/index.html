<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>西虹 ERP 本地控制台</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">XIHONG ERP / LOCAL</p>
        <h1>西虹 ERP 本地控制台</h1>
      </div>
      <div class="connection" aria-live="polite">
        <span class="connection-dot" aria-hidden="true"></span>
        <span id="connectionLabel">正在连接</span>
      </div>
    </header>

    <section id="globalNotice" class="global-notice" role="status" hidden></section>

    <section class="service-grid" aria-label="本地服务">
      <article class="service-card" data-service="local-collection">
        <div class="service-heading">
          <div>
            <p class="service-index">01 / SYSTEM</p>
            <h2>本地采集系统</h2>
            <p class="service-description">数据采集、云端同步与本地测试</p>
          </div>
          <span class="state-badge" data-role="state">未运行</span>
        </div>
        <p class="service-message" data-role="message" aria-live="polite">等待启动</p>
        <div class="service-actions">
          <button class="button primary" data-action="start">启动</button>
          <button class="button secondary" data-action="open" disabled>打开系统</button>
          <button class="button danger" data-action="stop" disabled>停止</button>
          <button class="log-button" data-action="log" hidden>查看日志</button>
        </div>
      </article>

      <article class="service-card" data-service="inspection-panel">
        <div class="service-heading">
          <div>
            <p class="service-index">02 / SESSION</p>
            <h2>巡店与会话</h2>
            <p class="service-description">人工巡店并保存平台登录会话</p>
          </div>
          <span class="state-badge" data-role="state">未运行</span>
        </div>
        <p class="service-message" data-role="message" aria-live="polite">等待启动</p>
        <div class="service-actions">
          <button class="button primary" data-action="start">启动面板</button>
          <button class="button secondary" data-action="open" disabled>打开面板</button>
          <button class="button danger" data-action="stop" disabled>停止</button>
          <button class="log-button" data-action="log" hidden>查看日志</button>
        </div>
      </article>
    </section>

    <footer class="control-footer">
      <div>
        <span class="footer-label">状态更新</span>
        <time id="updatedAt">--:--:--</time>
      </div>
      <div class="footer-actions">
        <button id="refreshButton" class="button secondary">刷新状态</button>
        <button id="stopAllButton" class="button danger">停止全部</button>
      </div>
    </footer>
  </main>

  <dialog id="logDialog" class="log-dialog">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">LOCAL LOG</p>
        <h2 id="logTitle">运行日志</h2>
      </div>
      <button id="closeLogButton" class="icon-button" title="关闭日志" aria-label="关闭日志">×</button>
    </div>
    <pre id="logContent" tabindex="0"></pre>
  </dialog>
</body>
</html>
